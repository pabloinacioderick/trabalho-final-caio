{% extends "base.html" %}{% block title %}Criar conta{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7 col-lg-6"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Criar conta</h1>
<form method="post">
<div class="mb-3"><label class="form-label">Nome de usuário</label><input class="form-control" name="username" required maxlength="80" autocomplete="username"></div>
<div class="mb-3"><label class="form-label">E-mail</label><input class="form-control" type="email" name="email" required maxlength="120" autocomplete="email"></div>
<div class="mb-3"><label class="form-label">Senha (mínimo 8 caracteres)</label><input class="form-control" type="password" name="senha" required minlength="8" autocomplete="new-password"></div>
<div class="mb-3"><label class="form-label">Confirmar senha</label><input class="form-control" type="password" name="confirmar_senha" required minlength="8" autocomplete="new-password"></div>
<button class="btn btn-primary w-100">Registrar</button>
</form><p class="mt-3 mb-0">Já tem conta? <a href="{{ url_for('login') }}">Entrar</a></p>
</div></div></div></div>
{% endblock %}
