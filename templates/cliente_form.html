{% extends "base.html" %}{% block title %}{{ titulo }}{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h2 mb-4">{{ titulo }}</h1>
<form method="post">
<div class="mb-3"><label class="form-label">Nome *</label><input class="form-control" name="nome" required maxlength="120" value="{{ cliente.nome if cliente else '' }}"></div>
<div class="mb-3"><label class="form-label">E-mail *</label><input class="form-control" type="email" name="email" required maxlength="120" value="{{ cliente.email if cliente else '' }}"></div>
<div class="mb-3"><label class="form-label">Telefone</label><input class="form-control" name="telefone" maxlength="30" value="{{ cliente.telefone if cliente else '' }}"></div>
<div class="mb-3"><label class="form-label">CPF/CNPJ</label><input class="form-control" name="cpf_cnpj" maxlength="30" value="{{ cliente.cpf_cnpj if cliente else '' }}"></div>
<button class="btn btn-primary">Salvar</button> <a class="btn btn-outline-secondary" href="{{ url_for('clientes') }}">Cancelar</a>
</form></div></div></div></div>
{% endblock %}
