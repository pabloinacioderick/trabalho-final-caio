{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5"><div class="card shadow-sm"><div class="card-body p-4">
<h1 class="h3 mb-3">Entrar no SGC</h1>
<form method="post">
<div class="mb-3"><label class="form-label">Usuário ou e-mail</label><input class="form-control" name="identificador" required autocomplete="username"></div>
<div class="mb-3"><label class="form-label">Senha</label><input class="form-control" type="password" name="senha" required autocomplete="current-password"></div>
<button class="btn btn-primary w-100">Entrar</button>
</form><p class="mt-3 mb-0">Não tem conta? <a href="{{ url_for('registro') }}">Criar conta</a></p>
</div></div></div></div>
{% endblock %}
